<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hoko Portfolio</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Noto+Sans+JP:wght@100..900&family=Shippori+Mincho&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./css/style.css" />
    <script src="./js/main.js" defer></script>
  </head>
  <body>
    <!-- ===================================== -->
    <!-- header -->
    <!-- ===================================== -->
    <header class="p-header">
      <div class="p-header__inner">
        <a href="#top" class="p-header__logo" aria-label="トップへ戻る">Hoko</a>
        <!-- Nav(pc) -->
        <nav class="p-header__nav" aria-label="グローバルナビ">
          <ul class="p-header__nav-list">
            <li class="p-header__nav-item">
              <a class="p-header__nav-link" href="#about">About</a>
            </li>
            <li class="p-header__nav-item">
              <a class="p-header__nav-link" href="#services">Service</a>
            </li>
            <li class="p-header__nav-item">
              <a class="p-header__nav-link" href="#works">Works</a>
            </li>
            <li class="p-header__nav-item">
              <a class="p-header__nav-link" href="#contact">Contact</a>
            </li>
          </ul>
        </nav>
        <!-- Hamburger(sp) -->
        <button
          class="p-header__hamburger js-hamburger"
          type="button"
          aria-expanded="false"
          aria-label="メニューを開く"
        >
          <span class="p-header__hamburger-bar"></span>
          <span class="p-header__hamburger-bar"></span>
        </button>
        <!-- Drawer(sp) -->
        <nav class="p-header__drawer js-drawer" aria-label="ドロワーナビ">
          <ul class="p-header__drawer-list">
            <li class="p-header__drawer-item">
              <a class="p-header__drawer-link" href="#about">About</a>
            </li>
            <li class="p-header__drawer-item">
              <a class="p-header__drawer-link" href="#services">Service</a>
            </li>
            <li class="p-header__drawer-item">
              <a class="p-header__drawer-link" href="#works">Works</a>
            </li>
            <li class="p-header__drawer-item">
              <a class="p-header__drawer-link" href="#contact">Contact</a>
            </li>
          </ul>
        </nav>
      </div>
    </header>

    <main id="top">
      <section class="p-fv">
        <div class="p-fv__inner">
          <div class="p-fv__wrapper">
            <p class="p-fv__logo">Hoko</p>
            <p class="p-fv__text">Portfolio</p>
            <h1 class="p-fv__catch">ここにテキストが入ります</h1>
            <p class="p-fv__sub">
              ここにテキストが入りますここにテキストが入ります
              <br />ここにテキストが入ります
            </p>
          </div>
          <div class="p-fv__scroll">
            <span class="p-fv__scroll-text">Scroll</span>
            <span class="p-fv__scroll-line"></span>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
